<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>App Remitos PDF Final</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body { font-family: Arial; background:#f4f4f4; margin:20px; }
.container { max-width:700px; margin:auto; background:white; padding:20px; border-radius:10px; }
input, button { width:100%; padding:10px; margin-top:10px; }
canvas { border:1px solid black; width:100%; height:200px; touch-action:none; }
.hidden { display:none; }

table { width:100%; margin-top:20px; border-collapse:collapse; }
th, td { border:1px solid #ccc; padding:6px; font-size:12px; }
</style>
</head>

<body>

<div class="container" id="loginDiv">
    <h2>Login</h2>
    <input id="username" placeholder="Nombre usuario">
    <button onclick="login()">Ingresar</button>
</div>

<div class="container hidden" id="appDiv">
    <h2>Nuevo Remito</h2>

    <input id="codigoCliente" placeholder="Código Cliente">
    <input id="nombreCliente" placeholder="Nombre y Apellido">
    <input id="monto" type="number" placeholder="Monto">

    <p><strong>Fecha:</strong> <span id="fechaHora"></span></p>

    <canvas id="firmaCanvas"></canvas>
    <button onclick="limpiarFirma()">Limpiar Firma</button>

    <button onclick="guardarRemito()">Guardar Remito</button>

    <h3>Registros</h3>
    <table>
        <thead>
            <tr>
                <th>Usuario</th>
                <th>Cliente</th>
                <th>Monto</th>
                <th>Fecha</th>
            </tr>
        </thead>
        <tbody id="tablaRemitos"></tbody>
    </table>

    <button onclick="exportarPDF()">Exportar PDF del día</button>
    <button onclick="limpiarTodo()">Cerrar día</button>
</div>

<script>
let usuario = "";

// LOGIN
function login(){
    usuario = username.value;
    if(!usuario) return alert("Ingrese usuario");
    localStorage.setItem("usuario", usuario);

    loginDiv.classList.add("hidden");
    appDiv.classList.remove("hidden");

    cargarTabla();
}

// FECHA
function actualizarFechaHora(){
    fechaHora.innerText = new Date().toLocaleString();
}
setInterval(actualizarFechaHora,1000);

// FIRMA
const canvas = document.getElementById("firmaCanvas");
const ctx = canvas.getContext("2d");
let dibujando=false;

function pos(e){
    const r=canvas.getBoundingClientRect();
    return {
        x:(e.touches?e.touches[0].clientX:e.clientX)-r.left,
        y:(e.touches?e.touches[0].clientY:e.clientY)-r.top
    };
}

canvas.addEventListener("mousedown",e=>{
    dibujando=true;
    let p=pos(e);
    ctx.beginPath();
    ctx.moveTo(p.x,p.y);
});

canvas.addEventListener("mousemove",e=>{
    if(!dibujando)return;
    let p=pos(e);
    ctx.lineTo(p.x,p.y);
    ctx.stroke();
});

canvas.addEventListener("mouseup",()=>dibujando=false);

canvas.addEventListener("touchstart",e=>{
    dibujando=true;
    let p=pos(e);
    ctx.beginPath();
    ctx.moveTo(p.x,p.y);
});

canvas.addEventListener("touchmove",e=>{
    if(!dibujando)return;
    e.preventDefault();
    let p=pos(e);
    ctx.lineTo(p.x,p.y);
    ctx.stroke();
});

canvas.addEventListener("touchend",()=>dibujando=false);

function limpiarFirma(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
}

// GUARDAR
function guardarRemito(){
    let remito={
        usuario,
        codigo:codigoCliente.value,
        nombre:nombreCliente.value,
        monto:monto.value,
        fecha:new Date().toLocaleString(),
        firma:canvas.toDataURL("image/png")
    };

    if(!remito.codigo||!remito.nombre||!remito.monto)
        return alert("Complete todo");

    let datos=JSON.parse(localStorage.getItem("remitos"))||[];
    datos.push(remito);
    localStorage.setItem("remitos",JSON.stringify(datos));

    cargarTabla();

    codigoCliente.value="";
    nombreCliente.value="";
    monto.value="";
    limpiarFirma();
}

// TABLA
function cargarTabla(){
    let datos=JSON.parse(localStorage.getItem("remitos"))||[];
    tablaRemitos.innerHTML="";

    datos.forEach(r=>{
        tablaRemitos.innerHTML+=`
        <tr>
            <td>${r.usuario}</td>
            <td>${r.nombre}</td>
            <td>${r.monto}</td>
            <td>${r.fecha}</td>
        </tr>`;
    });
}

// PDF FINAL
function exportarPDF(){
    const { jsPDF } = window.jspdf;
    let doc = new jsPDF();

    let datos=JSON.parse(localStorage.getItem("remitos"))||[];
    if(datos.length===0) return alert("Sin datos");

    let y = 20;

    doc.setFontSize(16);
    doc.text("REMlTOS DEL DIA", 20, y);
    y += 10;

    datos.forEach((r, i) => {

        if (y > 250) {
            doc.addPage();
            y = 20;
        }

        doc.setFontSize(11);
        doc.text(`Cliente: ${r.nombre}`, 20, y);
        y += 6;
        doc.text(`Codigo: ${r.codigo}`, 20, y);
        y += 6;
        doc.text(`Monto: $${r.monto}`, 20, y);
        y += 6;
        doc.text(`Fecha: ${r.fecha}`, 20, y);
        y += 6;
        doc.text(`Usuario: ${r.usuario}`, 20, y);
        y += 6;

        doc.text("Firma:", 20, y);
        y += 4;

        // Firma grande adaptada
        doc.addImage(r.firma, "PNG", 20, y, 160, 40);
        y += 45;

        // Separador
        doc.line(20, y, 190, y);
        y += 5;
    });

    doc.save("remitos_del_dia.pdf");
}

// LIMPIAR
function limpiarTodo(){
    if(confirm("Cerrar día?")){
        localStorage.removeItem("remitos");
        cargarTabla();
    }
}

// AUTOLOGIN
window.onload=()=>{
    let u=localStorage.getItem("usuario");
    if(u){
        usuario=u;
        loginDiv.classList.add("hidden");
        appDiv.classList.remove("hidden");
        cargarTabla();
    }
}
</script>

</body>
</html>
