<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>App Remitos PRO FINAL</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body { font-family: Arial; background:#f4f4f4; margin:20px; }
.container { max-width:700px; margin:auto; background:white; padding:20px; border-radius:10px; }
input, button { width:100%; padding:10px; margin-top:10px; }
canvas { border:1px solid black; width:100%; height:200px; touch-action:none; }
.hidden { display:none; }

table { width:100%; margin-top:20px; border-collapse:collapse; }
th, td { border:1px solid #ccc; padding:6px; font-size:12px; text-align:center; }
button.small { width:auto; padding:5px; font-size:11px; }
</style>
</head>

<body>

<div class="container" id="loginDiv">
    <h2>Login</h2>
    <input id="username" placeholder="Nombre usuario">
    <button onclick="login()">Ingresar</button>
</div>

<div class="container hidden" id="appDiv">
    <h2>Nuevo Remito</h2>

    <p><strong>N° Comprobante:</strong> <span id="nroComprobante"></span></p>

    <input id="codigoCliente" placeholder="Código Cliente">
    <input id="nombreCliente" placeholder="Nombre y Apellido">
    <input id="monto" type="number" placeholder="Monto">

    <p><strong>Fecha:</strong> <span id="fechaHora"></span></p>

    <canvas id="firmaCanvas"></canvas>
    <button onclick="limpiarFirma()">Limpiar Firma</button>

    <button onclick="guardarRemito()">Guardar Remito</button>
    <button onclick="exportarUltimo()">Exportar último remito</button>

    <h3>Registros</h3>
    <table>
        <thead>
            <tr>
                <th>N°</th>
                <th>Cliente</th>
                <th>Monto</th>
                <th>Fecha</th>
                <th>Acción</th>
            </tr>
        </thead>
        <tbody id="tablaRemitos"></tbody>
    </table>

    <button onclick="exportarTodos()">Exportar todos (PDF)</button>
    <button onclick="limpiarTodo()">Cerrar día</button>
</div>

<script>
let usuario="";

// ====== NUMERO DE COMPROBANTE ======
function obtenerSiguienteNumero(){
    let n = parseInt(localStorage.getItem("contadorComprobantes")) || 0;
    n++;
    localStorage.setItem("contadorComprobantes", n);
    return n.toString().padStart(2,"0");
}

function mostrarProximoNumero(){
    let n = parseInt(localStorage.getItem("contadorComprobantes")) || 0;
    n++;
    nroComprobante.innerText = n.toString().padStart(2,"0");
}

// LOGIN
function login(){
    usuario=username.value;
    if(!usuario) return alert("Ingrese usuario");
    localStorage.setItem("usuario",usuario);

    loginDiv.classList.add("hidden");
    appDiv.classList.remove("hidden");

    mostrarProximoNumero();
    cargarTabla();
}

// FECHA
function actualizarFechaHora(){
    fechaHora.innerText=new Date().toLocaleString();
}
setInterval(actualizarFechaHora,1000);

// FIRMA
const canvas=document.getElementById("firmaCanvas");
const ctx=canvas.getContext("2d");
let dibujando=false;

function pos(e){
    const r=canvas.getBoundingClientRect();
    return {
        x:(e.touches?e.touches[0].clientX:e.clientX)-r.left,
        y:(e.touches?e.touches[0].clientY:e.clientY)-r.top
    };
}

canvas.addEventListener("mousedown",e=>{
    dibujando=true;
    let p=pos(e);
    ctx.beginPath();
    ctx.moveTo(p.x,p.y);
});

canvas.addEventListener("mousemove",e=>{
    if(!dibujando)return;
    let p=pos(e);
    ctx.lineTo(p.x,p.y);
    ctx.stroke();
});

canvas.addEventListener("mouseup",()=>dibujando=false);

canvas.addEventListener("touchstart",e=>{
    dibujando=true;
    let p=pos(e);
    ctx.beginPath();
    ctx.moveTo(p.x,p.y);
});

canvas.addEventListener("touchmove",e=>{
    if(!dibujando)return;
    e.preventDefault();
    let p=pos(e);
    ctx.lineTo(p.x,p.y);
    ctx.stroke();
});

canvas.addEventListener("touchend",()=>dibujando=false);

function limpiarFirma(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
}

// GUARDAR
function guardarRemito(){

    let numero = obtenerSiguienteNumero();

    let remito={
        numero,
        usuario,
        codigo:codigoCliente.value,
        nombre:nombreCliente.value,
        monto:monto.value,
        fecha:new Date().toLocaleString(),
        firma:canvas.toDataURL("image/png")
    };

    if(!remito.codigo||!remito.nombre||!remito.monto)
        return alert("Complete todo");

    let datos=JSON.parse(localStorage.getItem("remitos"))||[];
    datos.push(remito);
    localStorage.setItem("remitos",JSON.stringify(datos));

    cargarTabla();
    mostrarProximoNumero();

    codigoCliente.value="";
    nombreCliente.value="";
    monto.value="";
    limpiarFirma();
}

// TABLA
function cargarTabla(){
    let datos=JSON.parse(localStorage.getItem("remitos"))||[];
    tablaRemitos.innerHTML="";

    datos.forEach((r,i)=>{
        tablaRemitos.innerHTML+=`
        <tr>
            <td>${r.numero}</td>
            <td>${r.nombre}</td>
            <td>$${r.monto}</td>
            <td>${r.fecha}</td>
            <td>
                <button class="small" onclick="exportarIndividual(${i})">PDF</button>
            </td>
        </tr>`;
    });
}

// PDF INDIVIDUAL
function exportarIndividual(index){
    let datos=JSON.parse(localStorage.getItem("remitos"))||[];
    let r=datos[index];
    generarPDFIndividual(r);
}

// PDF ULTIMO
function exportarUltimo(){
    let datos=JSON.parse(localStorage.getItem("remitos"))||[];
    if(datos.length===0) return alert("Sin datos");
    generarPDFIndividual(datos[datos.length-1]);
}

// GENERADOR INDIVIDUAL
function generarPDFIndividual(r){
    const { jsPDF } = window.jspdf;
    let doc=new jsPDF();

    doc.setFontSize(16);
    doc.text("REMITO DE ENTREGA",20,20);

    doc.setFontSize(12);
    doc.text(`N°: ${r.numero}`,20,35);
    doc.text(`Cliente: ${r.nombre}`,20,45);
    doc.text(`Codigo: ${r.codigo}`,20,55);
    doc.text(`Monto: $${r.monto}`,20,65);
    doc.text(`Fecha: ${r.fecha}`,20,75);
    doc.text(`Usuario: ${r.usuario}`,20,85);

    doc.text("Firma:",20,100);
    doc.addImage(r.firma,"PNG",20,105,160,50);

    doc.save(`remito_${r.numero}.pdf`);
}

// PDF TODOS
function exportarTodos(){
    const { jsPDF } = window.jspdf;
    let doc=new jsPDF();

    let datos=JSON.parse(localStorage.getItem("remitos"))||[];
    if(datos.length===0) return alert("Sin datos");

    let y=20;

    doc.text("REMITOS DEL DIA",20,y);
    y+=10;

    datos.forEach(r=>{
        if(y>250){
            doc.addPage();
            y=20;
        }

        doc.text(`N°: ${r.numero}`,20,y); y+=6;
        doc.text(`Cliente: ${r.nombre}`,20,y); y+=6;
        doc.text(`Codigo: ${r.codigo}`,20,y); y+=6;
        doc.text(`Monto: $${r.monto}`,20,y); y+=6;
        doc.text(`Fecha: ${r.fecha}`,20,y); y+=6;
        doc.text(`Usuario: ${r.usuario}`,20,y); y+=6;

        doc.text("Firma:",20,y); y+=4;
        doc.addImage(r.firma,"PNG",20,y,160,40);
        y+=45;

        doc.line(20,y,190,y);
        y+=5;
    });

    doc.save("remitos_del_dia.pdf");
}

// LIMPIAR
function limpiarTodo(){
    if(confirm("Cerrar día?")){
        localStorage.removeItem("remitos");
        localStorage.removeItem("contadorComprobantes");
        cargarTabla();
        mostrarProximoNumero();
    }
}

// AUTOLOGIN
window.onload=()=>{
    let u=localStorage.getItem("usuario");
    if(u){
        usuario=u;
        loginDiv.classList.add("hidden");
        appDiv.classList.remove("hidden");
        mostrarProximoNumero();
        cargarTabla();
    }
}
</script>

</body>
</html>
